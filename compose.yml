services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: job_board_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"

  web:
    build: .
    image: django-job-board-test-app:latest
    depends_on:
      - db
    env_file:
      - .envlocal
    ports:
      - "8000:8000"
